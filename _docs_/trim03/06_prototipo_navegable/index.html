<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BakeAdmin</title>
    <link rel="shortcut icon" href="public/img/logo_BakeAdmin.png">
    <link rel="stylesheet" href="public/css/bootstrap.min.css">
    <link rel="stylesheet" href="public/css/styles-bootstrap5.css">


</head>
<body>
    <div class="container-fluid vh-100 p-0 ">
        <div class="row h-100 g-0">
                 <!-- COLUMNA IZQUIERDA / LOGOS, TEXTO, ETC-->
                <div class="col-12 col-md-6 hero-panel p-5  d-flex flex-column justify-content-between">
                    <!--BLOQUE 1/  aqui es el logo y la version -->
                    <div class="d-flex justify-content-between align-items-center">
                        <!-- contenedor del logo con el texto -->
                         <div class="d-flex align-items-center gap-2">
                            <img src="public/img/logo22.png" alt="logo22" class="logo22-img">
                            <h5 class=" mb-0 text-whithe fw-bold">BakeAdmin</h5>
                            <small class="text-whithe-50">Sistema de Gestion</small>
                         </div>
                    </div>
                    <!--BLOQUE 2/ El texto principal  -->
                    <div class="my-auto">
                        <p class="hero-subtitulo">GESTION OPERATIVA</p>
                        <h1 class="hero-titulo">TU PANADERIA,<br>TU CONTROL.</h1>
                        <p class="hero-texto">Gestion produccion, pedidos,domicilios y compras desde un solo lugar</p>
                    </div>
                </div>
                <!-- COLUMNA DERECHA/ AQUI SE METERA EL FORMULARIO  -->
                <div class="col-12 col-md-6  d-flex align-items-center justify-content-center p-4 bg-whithe">
                    <!-- ancho del formulario -->"
                     <div class="form-contenedor">
                        <h2 class="fw-bold-md-1">Inicia sesion</h2>
                        <p class="text-muted mb-4">Accede a tu panel de control</p>
                     </div>
                </div>
            
        </div>
     </div>
    


    <script src="public/js/app.js"></script>
</body>
</html>
