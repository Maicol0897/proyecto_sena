<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="shortcut icon" href="../../public/img/logo.png">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">


</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-2 navbar-custom">
      <div class="container-fluid px-4">
        
        <!-- Logo y Nombre del Sistema -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
          <div class="bg-dark rounded overflow-hidden d-flex align-items-center justify-content-center logo-box">
            <img src="../../public/img/logo-bake.png" alt="BakeAdmin Logo" class="logo22-bake-img" style="width: 45px !important; height: 45px !important; object-fit: contain">
          </div>
          <div class="d-flex flex-column lh-sm">
            <span class="fw-bold text-dark fs-5 mb-0">BakeAdmin</span>
            <small class="text-muted text-subtitle">Gestión Operativa</small>
          </div>
        </a>

        <!-- Botón responsive para móviles -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Enlaces y Elementos de la Derecha -->
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0 gap-lg-2">
            <li class="nav-item">
              <a class="nav-link  fw-medium d-flex align-items-center gap-1" href="../cliente/dashboard.html">
                <i class="bi bi-grid-fill"></i> Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-secondary d-flex align-items-center gap-1" href="../cliente/menu.html">
                <i class="bi bi-people"></i> Menu
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-secondary d-flex align-items-center gap-1" href="../cliente/mis-pedidos.html">
                <i class="bi bi-cart3"></i> Mis pedidos
              </a>
            </li>
          <!-- Botón de Sincronizado y Avatar Usuario -->
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-sincronizado rounded-pill text_black d-flex align-items-center gap-2 px-3 py-1 fw-medium">
              <i class="bi bi-cloud-check"></i> Sincronizado
            </button>
            <div class="user-avatar rounded-circle text-black d-flex align-items-center justify-content-center fw-bold">
              AD
            </div>
          </div>
        </div>

      </div>
    </nav>
</body>
</html>
