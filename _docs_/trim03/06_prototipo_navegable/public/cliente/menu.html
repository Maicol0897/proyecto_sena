<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logo-bake.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>MENU</title>
</head>

<body>
    <!-- NAVEGADOR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2 border-0">
        <div class="container-fluid px-4 border-0">
            <!-- Brand / Logo + Título -->
            <a class="navbar-brand d-flex align-items-center gap-2 me-4" href="#">
                <img src="../img/logo.png" alt="BakeAdmin" class="rounded-3"
                    style="width: 45px; height: 45px; object-fit: cover;">
                <div class="lh-1">
                    <span class="fw-bold text-dark d-block fs-5">BakeAdmin</span>
                    <small class="text-muted fs-7">Gestión Operativa</small>
                </div>
            </a>

            <!-- Botón Toggle para vista móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido Navbar -->
            <div class="collapse navbar-collapse" id="navbarContent">

                <!-- Enlaces de navegación (Izquierda/Centro) -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                    <li class="nav-item">
                        <a class="nav-link active d-flex align-items-center gap-2 fw-medium text-secondary"
                            href="../cliente/dashboard.html">
                            <i class="bi bi-grid-1x2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2 fw-medium text-secondary"
                            href="../cliente/menu.html">
                            <i class="bi bi-cup-hot"></i> Menú
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2 fw-medium text-secondary"
                            href="../cliente/mis-pedidos.html">
                            <i class="bi bi-cart"></i> Mis Pedidos
                        </a>
                    </li>
                </ul>

                <!-- Zona Derecha: Sincronizado + Menú de Usuario -->
                <div class="d-flex align-items-center gap-3 ms-auto">

                    <!-- Badge Sincronizado -->
                    <span
                        class="badge bg-success rounded-pill px-3 py-2 fw-normal d-inline-flex align-items-center gap-1 fs-6">
                        <i class="bi bi-cloud-check-fill"></i> Sincronizado
                    </span>

                    <!-- Menú Desplegable Perfil / Cerrar Sesión -->
                    <div class="dropdown">
                        <button class="btn p-0 border-0 d-flex align-items-center" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="rounded-circle text-white d-flex align-items-center justify-content-center fw-bold shadow-sm"
                                style="width: 40px; height: 40px; background-color: #C05621; font-size: 0.9rem; cursor: pointer;">
                                AC
                            </div>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li>
                                <div class="px-3 py-2 border-bottom">
                                    <p class="mb-0 fw-bold text-dark">Mi Perfil</p>
                                    <small class="text-muted">usuario@bakeadmin.com</small>
                                </div>
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="#">
                                    <i class="bi bi-person text-secondary"></i> Ver Perfil
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger"
                                    href="../auth/login.html">Cerrar Sesión</a>
                            </li>
                        </ul>
                    </div>

                </div>

            </div>
        </div>
    </nav>

    <!-- tarjeta principal -->
    <div class="container-fluid px-4 py-3">
        <div>
            <div class="card w-100 mb-3 rounded-4 shadow-sm" style="background-color: #D35400;">
                <div class="card-body p-4 d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="card-text fw-medium mb-1" style="color: #FFE885;">¡Hola, Ana! ☕</h6>
                        <h3 class="card-title text-white mb-1">Menu BakeAdmin</h3>
                        <p class="card-text text-white mb-0">Selecciona tus productos y te los llevamos</p>
                    </div>

                    <!-- GRUPO 2: Lado Derecho (Alineado al centro derecho de la tarjeta) -->
                    <div class="text-white text-end">
                        <p class="mb-0 fw-medium">
                            Entrega: 30–45 min <br>
                            <span class="opacity-75">4.8 · Muy buenas reseñas</span>
                        </p>
                    </div>

                </div>

            </div>
        </div>
    </div>











    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
