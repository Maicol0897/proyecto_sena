<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/auth/recuperar.css">
  <title>Nueva contraseña - BakeAdmin</title>
</head>

<body>
  <div class="pantalla-completa min-vh-100">
    <!-- PANEL LATERAL - PRESENTACION DEL SOFTWARE -->
    <section
      class="panel-izq bg-vino-oscuro text-white p-5 flex-column position-relative overflow-hidden d-none d-lg-flex">
      <!-- CIRCULOS DECORATIVOS - FONDO -->
      <div class="bola-a position-absolute rounded-circle"></div>
      <div class="bola-b position-absolute rounded-circle"></div>
      <!-- LOGO/NOMBRE/ESLOGAN -->
      <div class="position-relative d-flex align-items-center gap-3">
        <!-- LOGO -->
        <img src="../img/logo.png" alt="logo-bakeadmin" class="logo rounded-4 object-fit-contain">
        <!-- NOMBRE/ESLOGAN -->
        <div class="marca">
          <!-- NOMBRE -->
          <h1 class="nombre mb-0">BakeAdmin</h1>
          <!-- ESLOGAN -->
          <p class="eslogan mb-0">Coffee Park</p>
        </div>
      </div>
      <div class="mensaje-cent my-auto position-relative">
        <p class="etiqueta d-flex align-items-center small fw-bold text-uppercase mb-3 gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
            <path d="M20 3v4" />
            <path d="M22 5h-4" />
          </svg>GESTIÓN OPERATIVA
        </p>
        <h2 class="titulo">
          <span class="titulo-1 d-block">TU PANADERÍA,</span>
          <span class="titulo-2 d-block">TU CONTROL.</span>
        </h2>
        <p class="texto mt-4">Gestiona producción, pedidos, domicilios y compras desde un solo lugar.</p>
      </div>
      <p class="pie-pag position-relative mb-0">Coffee Park · Colombia</p>
    </section>
    <section class="panel-der min-vh-100 d-flex align-items-center">
      <div class="caja-der mx-auto">
        <a href="login.html"
          class="volv-ini d-inline-flex align-items-center gap-2 fw-semibold small text-decoration-none">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-arrow-left preview-icon">
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
          <span>Volver al inicio</span>
        </a>
        <p class="paso mb-2 text-uppercase">PASO 2 DE 2</p>
        <h2 class="titulo-recuperar mb-0">Nueva contraseña</h2>
        <p class="descripcion small mt-2">Crea una nueva contraseña para admin@gmail.com.</p>
        <!-- FORMULARIO/NUEVA CONTRASEÑA -->
        <label for="nueva-clave" class="d-block nuev-clav">Nueva contraseña</label>
        <input type="password" id="nueva-clave" name="nueva-clave" required class="camp-nuev-clav">
        <!-- FORMULARIO/CONFIRMAR CONTRASEÑA -->
        <label for="confirmar-clave" class="d-block nuev-clav">Confirmar contraseña</label>
        <input type="password" id="confirmar-clave" name="confirmar-clave" required class="camp-confir-clav">
        <!-- BOTON/ACTUALIZAR CONTRASEÑA -->
        <!-- TEMPORAL EL BOTON SE METERA DENTRO DE UN ENLACE CORREGIR CUANDO SE HAGA LA LOGICA -->
        <a href="recuperar-3.html"><button type="submit" class="btn-act-clave">Actualizar contraseña</button></a>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
