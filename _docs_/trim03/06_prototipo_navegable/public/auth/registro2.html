<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/logo-bake.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth/registro2.css">
    <title>Cuenta creada - BakeAdmin</title>
</head>

<body>
    <div class="reg-auth min-vh-100">
        <!-- PANEL LATERAL IZQUIERDO (MOLDE 2.A) -->
        <section class="reg-izq d-none d-lg-flex flex-column justify-content-between position-relative overflow-hidden">
            <div class="reg-bola-a position-absolute rounded-circle"></div>
            <div class="reg-bola-b position-absolute rounded-circle"></div>

            <div class="reg-marca position-relative d-flex align-items-center gap-3">
                <img src="../img/logo.png" alt="Logo BakeAdmin" class="reg-logo object-fit-contain">
                <div>
                    <p class="reg-nombre mb-0">BakeAdmin</p>
                    <p class="reg-eslogan mb-0">Coffee Park</p>
                </div>
            </div>

            <div class="reg-mensaje-cent my-auto position-relative">
                <p class="reg-etiqueta d-flex align-items-center gap-2 text-uppercase mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
                        <path d="M20 3v4" />
                        <path d="M22 5h-4" />
                    </svg>
                    <span>GESTIÓN OPERATIVA</span>
                </p>
                <h2 class="reg-titulo mb-0">
                    <span class="d-block">TU PANADERÍA,</span>
                    <span class="reg-titulo-2 d-block">TU CONTROL.</span>
                </h2>
                <p class="reg-texto mt-4 mb-0">Gestiona producción, pedidos, domicilios y compras desde un solo lugar.
                </p>
            </div>

            <p class="reg-pie-pag position-relative mb-0">Coffee Park · Colombia</p>
        </section>

        <!-- PANEL DERECHO - CONFIRMACIÓN DE CUENTA CREADA -->
        <section class="reg-der min-vh-100 d-flex align-items-center">
            <div class="reg-caja-der mx-auto text-center">
                <span class="reg-icono-exito rounded-circle d-flex align-items-center justify-content-center mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="m16 9-5.5 5.5L8 12" />
                    </svg>
                </span>

                <h1 class="reg-titulo-exito mb-0">Cuenta creada correctamente</h1>
                <p class="reg-descripcion-exito mt-2 mb-0">Ya puedes iniciar sesión y pedir a domicilio.</p>

                <a href="login.html"
                    class="reg-btn-iniciar-sesion d-inline-flex align-items-center justify-content-center text-decoration-none">
                    Iniciar sesión
                </a>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
