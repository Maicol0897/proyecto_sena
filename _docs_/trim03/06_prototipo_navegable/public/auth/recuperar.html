<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.scc/recuperara-contraseña.css">
    <title>Document</title>
</head>
<body>
    <!-- contendor fondo -->
    <main class="contenedor-global">
        <div class="tarjeta-blanca">
            <div class="logo22-img">
                <img src="../../public/img/img-login/Bake-admin.png" alt="logo BakeAdmin">
            </div>
            <div class="texto">
                <h1>Recuperar contraseña</h1>
                <p>Ingresa tu correo electronico y te enviaremos instrucciones</p>
            </div>
            <!-- ENTRADA INFORMACION DE CORREO ELECTRONICO -->
            <form action="">
                <div class="email">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="correo@bakeadmin.com">
                </div>
                <button class="enviar-instrucciones"><span>&#x2709;</span> 
                    Enviar Instrucciones
                </button>
            </form>
            <div class="volver-inicio"><span>&#8592;</span> 
                <a href="#">Volver al inicio</a>
            </div>
        </div>
    </main>
</body>
</html>
