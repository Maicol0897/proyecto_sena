<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOREGISTRO-BA</title>
    <!--LOGO DE PESTAÑA-->
    <link rel="shortcut icon" href="../img/logo-bake.png">
    <!--BOOTSTRAP Y CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth/registro.css">
</head>

<body>
    <div class="pantalla-completa">
        <!--PARTE IZQUIERDA-->
        <section
            class="d-none d-lg-flex flex-column justify-content-between bg-vino-oscuro text-white p-5 position-relative overflow-hidden">
            <div class="bola-a"></div>
            <div class="bola-b"></div>
            <div class="d-flex align-items-center gap-3 position-relative">
                <img src="../img/logo.png" alt="logo BakeAdmin" class="logo">
                <div>
                    <div class="nombre">BakeAdmin</div>
                    <div class="eslogan">Coffe Park</div>
                </div>
            </div>
            <div class="mensaje-cent my-auto position-relative">
                <div class="etiqueta mb-3">GESTION OPERATIVA</div>
                <h1 class="titulo mb-0">
                    <span class="d-block">TU PANADERIA</span>
                    <span class="d-block titulo-2">TU CONTROL</span>
                </h1>
                <p class="texto mt-4 mb-0">
                    Gestion produccion , pedidos , domicilios y compras desde un solo lugar.
                </p>
            </div>
            <div class="pie-pag position-relative">Coffe Park Colombia </div>
        </section>
        <!--PARTE DERECHA-CREAR CUENTA-->
        <section class="panel-der">
            <div class="caja-der">
                <a href="login.html" class="volv-ini">VOLVER</a>
                <h2 class="titulo-registro">Crear Cuenta</h2>
                <p class="descripcion">Registrate como cliente de Coffe Park</p>
                <form class="form-registro">
                    <!--CAJA 1:ACCESO-->
                    <section class="caja-seccion">
                        <h3 class="titulo-seccion">Acceso</h3>
                        <div class="grilla-campos">
                            <div class="grupo-campo">
                                <label for="correo" class="etiqueta-campo">Correo</label>
                                <input type="email" id="correo" class="input-registro">
                            </div>
                            <div class="grupo-campo">
                                <label for="clave" class="etiqueta-campo">Contraseña</label>
                                <input type="password" id="clave" class="input-registro">
                            </div>
                            <div class="grupo-campo">
                                <label for="correo-rec" class="etiqueta-campo">Correo de recuperación</label>
                                <input type="email" id="correo-rec" class="input-registro">
                            </div>
                        </div>
                    </section>
                    <!--Caja 2:Informacion Personal-->
                    <section class="caja-seccion">
                        <h3 class="titulo-seccion">Informacion Personal</h3>
                        <div class="grilla-campos">
                            <div class="grupo-campo">
                                <label for="nombres" class="etiqueta-campo">Nombre</label>
                                <input type="text" id="nombres" class="input-registro">
                            </div>
                            <div class="grupo-campo">
                                <label for="apellidos" class="etiqueta-campo">Apellidos</label>
                                <input type="text" id="apellidos" class="input-registro">
                            </div>
                            <div class="grupo-campo">
                                <label for="tipo-doc" class="etiqueta-campo">Tipo de documento</label>
                                <select id="tipo-doc" class="input-registro">
                                    <option value="CC">CC</option>
                                    <option value="CE">CE</option>
                                    <option value="TI">TI</option>
                                    <option value="PP">PP</option>
                                    <option value="NIT">NIT</option>
                                </select>
                            </div>
                            <div class="grupo-campo">
                                <label for="num-doc" class="etiqueta-campo">Numero de Documento</label>
                                <input type="text" id="num-doc" class="input-registro">
                            </div>
                            <div class="grupo-campo">
                                <label for="telefono" class="etiqueta-campo">telefono</label>
                                <input type="text" id="telefono" class="input-registro">
                            </div>
                            <div class="grupo-campo campo-ancho-completo">
                                <label for="direccion" class="etiqueta-campo">Direccion</label>
                                <input type="text" id="direccion" class="input-registro">
                            </div>
                        </div>
                    </section>
                    <a href="../auth/registro2.html" class="btn-crear-cuenta">Crear Cuenta</a>
                    <p class="pie-registro">
                        ¿Ya tienes cuenta? <a href="./login.html" class="enlace-login">Iniciar Sesion</a>
                    </p>
                </form>
            </div>
        </section>
    </div>
</body>

</html>
